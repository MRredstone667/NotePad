<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Poznámky Live">
  <title>Poznámkový blok Live</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1c1c1e;
      color: #f2f2f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(90px + env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background-color: #2c2c2e;
      border-bottom: 1px solid #3a3a3c;
      align-items: center;
    }

    select {
      flex: 1;
      background-color: #1c1c1e;
      color: #fff;
      border: 1px solid #48484a;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
      outline: none;
    }

    .btn-small {
      background-color: #3a3a3c;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-danger {
      background-color: #6e2020;
    }

    .notepad-wrapper {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .notepad {
      background-color: #fdfbf7;
      color: #1c1c1e;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
    }

    .note-title {
      width: 100%;
      border: none;
      border-bottom: 2px solid #d90429;
      background: transparent;
      font-size: 22px;
      font-weight: 700;
      color: #1c1c1e;
      padding-bottom: 8px;
      margin-bottom: 12px;
      outline: none;
    }

    .note-content {
      width: 100%;
      min-height: 280px;
      border: none;
      background-color: transparent;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 31px,
        #d8e2dc 31px,
        #d8e2dc 32px
      );
      line-height: 32px;
      font-size: 17px;
      color: #1c1c1e;
      resize: none;
      overflow: hidden;
      outline: none;
      font-family: inherit;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: rgba(28, 28, 30, 0.95);
      border-top: 1px solid #3a3a3c;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn-primary {
      width: 100%;
      background-color: #d90429;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary.active {
      background-color: #3a3a3c;
    }

    .status {
      text-align: center;
      font-size: 12px;
      color: #8e8e93;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <select id="recentSelect"></select>
    <button class="btn-small" id="newBtn">Nová</button>
    <button class="btn-small btn-danger" id="deleteBtn">Smazat</button>
  </div>

  <div class="notepad-wrapper">
    <div class="notepad">
      <input type="text" id="noteTitle" class="note-title" placeholder="Název poznámky..." />
      <textarea id="noteContent" class="note-content" placeholder="Napiš poznámku..."></textarea>
    </div>
  </div>

  <div class="bottom-bar">
    <button id="liveBtn" class="btn-primary">Vyfotit a spustit Live na zamčené obrazovce</button>
    <div id="status" class="status">Připraveno</div>
  </div>

  <audio id="player" playsinline></audio>

  <script>
    const STORAGE_KEY = "pwa_lockscreen_notes_v1";

    const recentSelect = document.getElementById("recentSelect");
    const newBtn = document.getElementById("newBtn");
    const deleteBtn = document.getElementById("deleteBtn");
    const noteTitle = document.getElementById("noteTitle");
    const noteContent = document.getElementById("noteContent");
    const liveBtn = document.getElementById("liveBtn");
    const statusEl = document.getElementById("status");
    const player = document.getElementById("player");

    let notes = [];
    let currentNoteId = null;
    let audioCtx = null;
    let isRunning = false;

    // Automatické prodlužování textového pole
    function autoResize() {
      noteContent.style.height = "auto";
      noteContent.style.height = Math.max(280, noteContent.scrollHeight) + "px";
    }

    noteContent.addEventListener("input", () => {
      autoResize();
      saveCurrentNote();
    });

    noteTitle.addEventListener("input", () => {
      saveCurrentNote();
    });

    // Načtení a uložení do localStorage
    function loadNotes() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        notes = raw ? JSON.parse(raw) : [];
      } catch (e) {
        notes = [];
      }

      if (notes.length === 0) {
        createNewNote();
      } else {
        selectNote(notes[0].id);
      }
      renderDropdown();
    }

    function persistNotes() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    }

    function createNewNote() {
      const id = "note_" + Date.now();
      const newNote = {
        id: id,
        title: "Nová poznámka",
        content: "",
        updatedAt: Date.now()
      };
      notes.unshift(newNote);
      persistNotes();
      selectNote(id);
      renderDropdown();
    }

    function selectNote(id) {
      const found = notes.find(n => n.id === id);
      if (!found) return;
      currentNoteId = found.id;
      noteTitle.value = found.title;
      noteContent.value = found.content;
      autoResize();
    }

    function saveCurrentNote() {
      const found = notes.find(n => n.id === currentNoteId);
      if (!found) return;
      found.title = noteTitle.value.trim() || "Bez názvu";
      found.content = noteContent.value;
      found.updatedAt = Date.now();

      // Přesun aktuální poznámky na začátek seznamu nedávných
      notes.sort((a, b) => b.updatedAt - a.updatedAt);
      persistNotes();
      renderDropdown();
    }

    function renderDropdown() {
      recentSelect.innerHTML = "";
      notes.forEach(n => {
        const opt = document.createElement("option");
        opt.value = n.id;
        opt.textContent = n.title || "Bez názvu";
        if (n.id === currentNoteId) opt.selected = true;
        recentSelect.appendChild(opt);
      });
    }

    recentSelect.addEventListener("change", (e) => {
      selectNote(e.target.value);
    });

    newBtn.addEventListener("click", () => {
      createNewNote();
      noteTitle.focus();
    });

    deleteBtn.addEventListener("click", () => {
      if (notes.length <= 1) {
        noteTitle.value = "";
        noteContent.value = "";
        saveCurrentNote();
        autoResize();
        return;
      }
      notes = notes.filter(n => n.id !== currentNoteId);
      persistNotes();
      selectNote(notes[0].id);
      renderDropdown();
    });

    // Vykreslení poznámkového bloku do čtvercového obrázku (1024x1024)
    function renderNotepadToImage() {
      const canvas = document.createElement("canvas");
      const size = 1024;
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");

      // Pozadí papíru
      ctx.fillStyle = "#fdfbf7";
      ctx.fillRect(0, 0, size, size);

      const padding = 64;
      const maxWidth = size - padding * 2;
      const titleText = noteTitle.value.trim() || "Poznámka";

      // Nadpis
      ctx.fillStyle = "#1c1c1e";
      ctx.font = "bold 56px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillText(titleText, padding, 110, maxWidth);

      // Červená podtržítková linka pod nadpisem
      ctx.strokeStyle = "#d90429";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(padding, 136);
      ctx.lineTo(size - padding, 136);
      ctx.stroke();

      // Linky a text
      const lineHeight = 64;
      const startY = 205;
      ctx.font = "40px -apple-system, BlinkMacSystemFont, sans-serif";

      // Vykreslení linek papíru
      ctx.strokeStyle = "#d8e2dc";
      ctx.lineWidth = 3;
      for (let y = startY + 14; y < size - padding; y += lineHeight) {
        ctx.beginPath();
        ctx.moveTo(padding, y);
        ctx.lineTo(size - padding, y);
        ctx.stroke();
      }

      // Zalamování textu po slovech
      const paragraphs = noteContent.value.split("\n");
      const lines = [];

      for (const p of paragraphs) {
        if (p === "") {
          lines.push("");
          continue;
        }
        const words = p.split(" ");
        let currentLine = words[0];

        for (let i = 1; i < words.length; i++) {
          const testLine = currentLine + " " + words[i];
          if (ctx.measureText(testLine).width <= maxWidth) {
            currentLine = testLine;
          } else {
            lines.push(currentLine);
            currentLine = words[i];
          }
        }
        lines.push(currentLine);
      }

      // Vykreslení řádků textu
      ctx.fillStyle = "#1c1c1e";
      let y = startY;
      for (const line of lines) {
        if (y > size - padding) break;
        ctx.fillText(line, padding, y);
        y += lineHeight;
      }

      return canvas.toDataURL("image/jpeg", 0.9);
    }

    // Živý tichý audio proud
    function initLiveStream() {
      if (audioCtx) return;

      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();

      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      const destination = audioCtx.createMediaStreamDestination();

      oscillator.frequency.value = 1;
      gainNode.gain.value = 0.00001;

      oscillator.connect(gainNode);
      gainNode.connect(destination);
      oscillator.start();

      player.srcObject = destination.stream;
    }

    function updateMediaSession(imageDataUrl) {
      if (!("mediaSession" in navigator)) return;

      navigator.mediaSession.metadata = new MediaMetadata({
        title: noteTitle.value.trim() || "Poznámka",
        artist: "LIVE",
        album: "",
        artwork: [
          { src: imageDataUrl, sizes: "1024x1024", type: "image/jpeg" }
        ]
      });

      navigator.mediaSession.playbackState = "playing";

      const disabledActions = ["seekbackward", "seekforward", "seekto", "previoustrack", "nexttrack"];
      for (const action of disabledActions) {
        try {
          navigator.mediaSession.setActionHandler(action, null);
        } catch (e) {}
      }

      navigator.mediaSession.setActionHandler("play", () => startLive());
      navigator.mediaSession.setActionHandler("pause", () => stopLive());
    }

    async function startLive() {
      try {
        saveCurrentNote();
        const imgUrl = renderNotepadToImage();

        initLiveStream();
        if (audioCtx.state === "suspended") {
          await audioCtx.resume();
        }
        await player.play();
        updateMediaSession(imgUrl);

        isRunning = true;
        liveBtn.textContent = "Zastavit Live";
        liveBtn.classList.add("active");
        statusEl.textContent = "Živý přenos běží (zamkni obrazovku pro zobrazení)";
      } catch (err) {
        statusEl.textContent = "Chyba spuštění: " + err.message;
      }
    }

    function stopLive() {
      player.pause();
      if (audioCtx && audioCtx.state === "running") {
        audioCtx.suspend();
      }
      if ("mediaSession" in navigator) {
        navigator.mediaSession.playbackState = "paused";
      }

      isRunning = false;
      liveBtn.textContent = "Vyfotit a spustit Live na zamčené obrazovce";
      liveBtn.classList.remove("active");
      statusEl.textContent = "Pozastaveno";
    }

    liveBtn.addEventListener("click", () => {
      if (!isRunning) {
        startLive();
      } else {
        stopLive();
      }
    });

    // Inicializace při startu
    loadNotes();
  </script>
</body>
</html>
